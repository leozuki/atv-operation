  <rect x="8" y="8" width="384" height="384" rx="18" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.3"/>

  <!-- Top Tag -->
  <rect x="40" y="32" width="320" height="28" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="51" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#d97706" text-anchor="middle">ATTIVO TECHNICAL SERVICES</text>

  <!-- Central Technical Graphic -->
  <g id="iconGraphic">
    <circle cx="200" cy="175" r="52" fill="#0f172a" stroke="#d97706" stroke-width="6"/>
            <path d="M170 210 L210 150 C215 140 230 140 235 150 C240 160 235 170 225 175 L185 225 Z" fill="#f59e0b"/>
            <circle cx="225" cy="155" r="8" fill="#0f172a"/>
            <polygon points="160,150 170,145 180,150 180,162 170,167 160,162" fill="#fbbf24"/>
  </g>

  <!-- Bottom Titles & Details -->
