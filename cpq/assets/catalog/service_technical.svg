  <text x="200" y="330" font-family="'Lexend', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Dịch Vụ Kỹ Thuật, Lắp Đặt, Cân Chỉnh &amp; Bảo Trì Chuẩn Hãng</text>

  <!-- Footer Quality Seal -->
